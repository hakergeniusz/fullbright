[mod]
id = "fullbright"
version = "1.0.0"
priority = 100

# The commit it was tested on. It uses only the native hook points (hooks 1 in
# compatibility.json): the launcher builds it on any Horizon that has them.
[compatibility]
horizon_revision = "27cb8f96bfab58a6b5892d0cea5e630280d93657"

# The state (the toggle, the mode, the gamma strength) and the toggle key as
# plain values, with the tests.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "fullbright"
source = "runtime.rs"

# Each frame: the renderer's lightmap is full brightness while the mod is on,
# the player's own brightness (the video slider and Horizon Extras) otherwise.
# Nothing stored is ever changed, so turning the mod off gives it back.
[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_frame"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# The toggle key (B by default, rebindable in Options > Mods).
[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

# The mod's row in Options > Mods, with its rebindable key.
[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# The mod's settings page: on/off, the mode and the gamma strength.
[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

# A click on the mod's settings page: change the state and keep it.
[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
